# The `sim` board: an nRF52840-like node simulated by ariel-sim (dgtlrift/ariel-sim),
# on the `sim-chip` context. What SBD can't say yet (the SPI bus and its devices, the
# devices on I2C0, the program flash) is in ariel-sim's sidecar, `sim.sim.yaml`.
version: 0.4.1
targets:
  sim:
    chip: sim-chip
    leds:
      - pin: P0_00
        color: green
      - pin: P0_01
        color: red
    buttons:
      - pin: P0_02
        active: low
      - pin: P0_03
        active: low
    uarts:
      - aliases: [CONSOLE]
        rx_pin: P0_04
        tx_pin: P0_05
        possible_peripherals: [UART0]
        host_facing: true
    i2c:
      - aliases: [I2C0]
        sda_pin: P0_06
        scl_pin: P0_07
        possible_peripherals: [I2C0]
